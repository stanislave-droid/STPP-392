<section
  class="faq"
  aria-labelledby="faq-heading"
  data-observer="section"
  id="faq"
>
  <div class="container">
    <div class="faq-content">
      <div class="faq-heading-group">
        <p class="faq-label" aria-hidden="true" data-aos="fade-right">
          <svg class="faq-label-icon faq-label-icon-mobile" focusable="false">
            <use href="/img/sprite.svg#icon-faq-mob"></use>
          </svg>
          <svg class="faq-label-icon faq-label-icon-desktop" focusable="false">
            <use href="/img/sprite.svg#icon-faq"></use>
          </svg>
        </p>
        <h2
          id="faq-heading"
          class="faq-heading heading-outline-purple"
          data-aos="fade-left"
        >
          Quick answers
        </h2>
      </div>

      <div id="faq-accordion">
        <div class="ac faq-item" data-aos="fade-right">
          <h3 class="ac-header faq-item-header">
            <button type="button" class="ac-trigger faq-item-trigger">
              <span class="faq-item-question"
                >Is Piggy Kingdom free to play?</span
              >
              <svg
                class="faq-item-icon"
                width="32"
                height="32"
                aria-hidden="true"
                focusable="false"
              >
                <use href="./img/sprite.svg#icon-faq-plus"></use>
              </svg>
            </button>
          </h3>
          <div class="ac-panel faq-item-panel">
            <p class="ac-text faq-item-answer">
              Yes, with optional in-game purchases available.
            </p>
          </div>
        </div>

        <div class="ac faq-item" data-aos="fade-left">
          <h3 class="ac-header faq-item-header">
            <button type="button" class="ac-trigger faq-item-trigger">
              <span class="faq-item-question"
                >What is the main goal of the game?</span
              >
              <svg
                class="faq-item-icon"
                width="32"
                height="32"
                aria-hidden="true"
                focusable="false"
              >
                <use href="./img/sprite.svg#icon-faq-plus"></use>
              </svg>
            </button>
          </h3>
          <div class="ac-panel faq-item-panel">
            <p class="ac-text faq-item-answer">
              To restore and decorate the pig's lost castle kingdom.
            </p>
          </div>
        </div>

        <div class="ac faq-item" data-aos="fade-right">
          <h3 class="ac-header faq-item-header">
            <button type="button" class="ac-trigger faq-item-trigger">
              <span class="faq-item-question"
                >Are there boosters to help with hard levels?</span
              >
              <svg
                class="faq-item-icon"
                width="32"
                height="32"
                aria-hidden="true"
                focusable="false"
              >
                <use href="./img/sprite.svg#icon-faq-plus"></use>
              </svg>
            </button>
          </h3>
          <div class="ac-panel faq-item-panel">
            <p class="ac-text faq-item-answer">
              Yes, various boosters help clear difficult boards.
            </p>
          </div>
        </div>

        <div class="ac faq-item" data-aos="fade-left">
          <h3 class="ac-header faq-item-header">
            <button type="button" class="ac-trigger faq-item-trigger">
              <span class="faq-item-question"
                >Is the game suitable for beginners?</span
              >
              <svg
                class="faq-item-icon"
                width="32"
                height="32"
                aria-hidden="true"
                focusable="false"
              >
                <use href="./img/sprite.svg#icon-faq-plus"></use>
              </svg>
            </button>
          </h3>
          <div class="ac-panel faq-item-panel">
            <p class="ac-text faq-item-answer">
              Yes, it's designed for both beginners and experienced players.
            </p>
          </div>
        </div>

        <div class="ac faq-item" data-aos="fade-right">
          <h3 class="ac-header faq-item-header">
            <button type="button" class="ac-trigger faq-item-trigger">
              <span class="faq-item-question"
                >Are new levels added regularly?</span
              >
              <svg
                class="faq-item-icon"
                width="32"
                height="32"
                aria-hidden="true"
                focusable="false"
              >
                <use href="./img/sprite.svg#icon-faq-plus"></use>
              </svg>
            </button>
          </h3>
          <div class="ac-panel faq-item-panel">
            <p class="ac-text faq-item-answer">
              Yes, new levels and areas are added frequently.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
